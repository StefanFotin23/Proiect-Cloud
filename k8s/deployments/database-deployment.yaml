apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - backend
      containers:
        - name: database
          image: your-database-image
          ports:
            - containerPort: 5432